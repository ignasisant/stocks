# What the assistant should be able to answer, area by area, asked of the
# REAL app in production (src/stocks/chat/prod_eval.py, scripts/eval_prod.py).
#
#   uv run python scripts/eval_prod.py --dry-run                 # list, no calls
#   uv run python scripts/eval_prod.py --model free              # what users get
#   uv run python scripts/eval_prod.py --model free --model anthropic:claude-haiku-4-5 \
#       --model openrouter:deepseek/deepseek-v4.1-flash --judge anthropic:claude-sonnet-5-5 --save
#
# Areas are the app's pages and tabs (`chat/navigate.PAGES`) plus `assistant`
# (the chat itself), `concept` (finance vocabulary) and `abstain` (what it
# must not make up). tests/test_prod_eval.py fails when a page has no question.
#
# Fields
#   id        unique slug
#   area      page or page/tab
#   kind      howto    how to do something in TopStocks (answer from the KB)
#             data     a market figure (truth read from the app's own API)
#             book     the eval account's portfolio (demo book; truth from API)
#             concept  a definition or general finance knowledge
#             abstain  unknowable or out of scope: must not invent
#             action   asks the app to do something (a proposal, never run)
#   message   the question, as a reader types it
#   goals     what a useful answer shows (judged); each kind adds its own
#             defaults (`prod_eval.KIND_GOALS`)
#   opens     page or page/tab the answer should offer a button to (navigate)
#   mentions  at least one of these words must appear (accents/case ignored)
#   forbids   none of these may appear
#   truth     [{get: /api path, pick: field path, label, tol}] read from prod
#             before the question; numbers are checked against the answer
#             within `tol` (relative), and the judge sees them as reference
#   refs      more /api paths whose figures count as a source. With the truths,
#             each named ticker's quote + metrics and (book) the portfolio,
#             they make the pool: a figure the answer gives that none of them
#             states is "unsourced", and 3 of those = hallucination
#   view/tab/focus  where the reader is (the drawer's run `state`)
#   depth     "" | deep
#   lang      the drawer's language, es (default) or en

# ------------------------------------------------------------------- import

- id: import-revolut
  area: import
  kind: howto
  message: "¿Cómo importo mis acciones de Revolut?"
  goals:
    - Says to export the trading statement from Revolut (Stocks, statement) as CSV, PDF also works
    - Says to upload it on the Import page and press Confirm after the preview
  opens: import
  mentions: [csv, extracto, statement]

- id: import-degiro
  area: import
  kind: howto
  message: "tengo las acciones en DEGIRO, ¿qué fichero subo?"
  goals:
    - Names Transactions export as CSV (Activity, Transactions, Export)
    - Warns that Portfolio.csv or Account.csv are refused, and that dividends are not in this file
  opens: import
  mentions: [transacciones, transactions]

- id: import-ibkr-semicolon
  area: import
  kind: howto
  message: "He subido el CSV de Interactive Brokers y no lo lee, está separado por punto y coma"
  goals:
    - Says the IBKR CSV must be comma-separated and to export it again with commas
  mentions: [coma, comma]

- id: import-duplicates
  area: import
  kind: howto
  message: "Si vuelvo a subir el mismo extracto, ¿se me duplican las operaciones?"
  goals:
    - Says rows already in the portfolio are left out by default (Already in your portfolio group)
    - Mentions the opt-in to import them anyway for genuine identical fills

- id: import-undo
  area: import
  kind: howto
  message: "me he equivocado de fichero al importar, ¿cómo lo deshago?"
  goals:
    - Points to Clear last import, which deletes exactly the rows of the latest import
  opens: import

- id: import-crypto-binance
  area: import
  kind: howto
  message: "¿Puedo importar mis cripto de Binance?"
  goals:
    - Says yes, drop the Binance export in the Import page or attach it in the chat
    - Says coins are stored as pairs (BTC-EUR)

- id: import-transfer
  area: import
  kind: howto
  message: "Pasé mis acciones de DEGIRO a IBKR y ahora me sale una plusvalía que no he tenido"
  goals:
    - Explains a transfer is not a sale and the app can record it as a transfer (Repairs, Record as transfers)
    - Says the original cost and dates are kept

- id: import-unlisted
  area: import
  kind: howto
  message: "Al importar me dice que SAN se queda a coste sin precio, ¿qué hago?"
  goals:
    - Explains Yahoo does not list that code and offers Pick its market on the Import page
    - Mentions the row still imports, held at cost

# --------------------------------------------------------------- portfolio

- id: portfolio-value
  area: portfolio/overview
  kind: book
  message: "¿Cuánto vale mi cartera ahora mismo?"
  goals:
    - Gives the current market value of the book with its currency
    - Gives the gain or loss against cost
  truth:
    - {get: /portfolio/summary, pick: value, label: "Book market value", tol: 0.05}

- id: portfolio-biggest
  area: portfolio/positions
  kind: book
  message: "¿Cuál es mi mayor posición y qué peso tiene?"
  goals:
    - Names the largest position by market value, as in the reference
    - Gives its weight in the book
  truth:
    - {get: /portfolio/positions, label: "Open positions"}

- id: portfolio-holds-x
  area: portfolio/positions
  kind: book
  message: "¿Tengo acciones de Amazon?"
  goals:
    - Says the book does not hold AMZN (it is not in the positions)
  truth:
    - {get: /portfolio/positions, label: "Open positions"}
  forbids: ["sí, tienes"]

- id: portfolio-holds-nvda
  area: portfolio/positions
  kind: book
  message: "¿cuántas NVDA tengo y a qué precio medio?"
  goals:
    - Gives the NVDA share count and average cost from the positions
  truth:
    - {get: /portfolio/positions, pick: "positions[ticker=NVDA].shares", label: "NVDA shares", tol: 0.01}

- id: portfolio-twr-vs-irr
  area: portfolio/overview
  kind: howto
  message: "¿Por qué tengo dos rentabilidades distintas en la cartera?"
  goals:
    - Explains time-weighted return (picks) vs money-weighted IRR (your money, timing of deposits)

- id: portfolio-risk-concentration
  area: portfolio/risk
  kind: book
  message: "¿Está muy concentrada mi cartera?"
  goals:
    - Uses the real weights of the book (top holdings and their share)
    - Says the book is concentrated in US tech, if the positions show it
  opens: portfolio/risk
  truth:
    - {get: /portfolio/positions, label: "Open positions"}

- id: portfolio-var
  area: portfolio/risk
  kind: howto
  message: "¿Qué significa el VaR que sale en riesgo?"
  goals:
    - Explains one-day historical VaR at 95 % as a loss exceeded on about one day in twenty
  mentions: ["95"]

- id: portfolio-projection
  area: portfolio/projection
  kind: howto
  message: "¿cómo calcula la app la proyección a 5 años?"
  goals:
    - Describes scenarios (growth rates, index references or own rate) and contributions
    - Does not promise a result
  opens: portfolio/projection

- id: portfolio-tax-year
  area: portfolio/tax
  kind: book
  message: "¿Cuánto tengo que pagar a Hacienda por mis ventas de este año?"
  goals:
    - Uses the realized gains of the tax tab, says if there are no sales this year
    - Does not invent sales the book does not have
  opens: portfolio/tax
  truth:
    - {get: /portfolio/tax, label: "Tax report"}

- id: portfolio-fifo
  area: portfolio/tax
  kind: howto
  message: "¿Qué método usa la app para calcular la plusvalía cuando vendo una parte?"
  goals:
    - Says FIFO for Spain (first shares bought are the first sold), and that the method depends on the tax country

- id: portfolio-wash-sale
  area: portfolio/tax
  kind: concept
  message: "Si vendo con pérdidas y recompro a la semana, ¿puedo compensar la pérdida en España?"
  goals:
    - Explains the two-month rule (one year for unlisted) that defers the loss
    - Mentions the app shows the repurchase-window date

- id: portfolio-dividends
  area: portfolio/dividends
  kind: book
  message: "¿Cuántos dividendos he cobrado?"
  goals:
    - Gives the dividends booked in the ledger
  opens: portfolio/dividends
  truth:
    - {get: /portfolio/dividends, label: "Dividends"}

- id: portfolio-fees
  area: portfolio/fees
  kind: howto
  message: "¿Dónde veo cuánto me cobra el bróker en comisiones?"
  goals:
    - Points to the Fees tab of Portfolio and says it includes commissions and spread
  opens: portfolio/fees

- id: portfolio-currency
  area: portfolio/overview
  kind: howto
  message: "¿Puedo ver la cartera en dólares en vez de euros?"
  goals:
    - Says the reporting currency is set in Preferences (Profile)
  opens: profile/prefs

