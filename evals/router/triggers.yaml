# Trigger evals for the chat's skill auto-router (src/stocks/web/chat_skills.py).
#
# One block per skill in src/stocks/web/skills/. `should` are questions the
# router must pick the skill for (EN + ES, the way an investor types them);
# `near_miss` sound adjacent but belong to another skill or to none, so the
# skill must NOT be picked for them. Every question is read on its own.
#
#   uv run pytest tests/test_skill_router_evals.py          # keyword fallback, offline (CI)
#   uv run python scripts/eval_router.py [--provider free]  # the live LLM router, opt-in
#
# The offline test pins per-skill recall and the near-miss false-positive rate
# (tests/test_skill_router_evals.py); the live script prints the hit rate of the
# real router over the same questions. Adding a skill = adding its block here.

tech:
  should:
    - "Is Palantir's valuation justified by its revenue growth?"
    - "¿Qué opinas de Snowflake? Su net revenue retention está cayendo"
    - "Does Salesforce still have a moat against AI-native SaaS startups?"
    - "Analiza Microsoft: crecimiento de Azure, márgenes y dilución por SBC"
