[project]
name = "stocks"
version = "0.1.0"
description = "Personal stock tracking: data fetch, indicators, alerts, dashboard"
readme = "README.md"
authors = [
    { name = "Ignasi", email = "ignasi.sant@hotmail.es" }
]
requires-python = ">=3.12"
dependencies = [
    # The chat drawer's wire format (api/routes/chat.py): AG-UI's event and
    # RunAgentInput models, so the stream is a published protocol rather than
    # four frame names only our own client knows. Pydantic only, no runtime.
    "ag-ui-protocol>=1.0",
    "anthropic>=0.69",
    # The OIDC client behind our own sign-in (web/oidc.py). Floor is 1.8 because
    # `create_authorization_url` returns the code verifier there, and PKCE is
    # opt-in through `code_challenge_method` rather than sniffed from metadata.
    "authlib>=1.8",
    # Exact: the generated client (src/stocks/baml_client) checks the runtime
    # version on import. Bump both together — `uv run baml-cli generate`.
    "baml-py==0.226.2",
    "boto3>=1.35",
    "cryptography>=43",
    "ddgs>=9.15.0",
    "fastapi>=0.120",
    "google-genai>=1.0",
    # uvicorn's `--http auto` parses with httptools when it is installed and
    # falls back to pure-Python h11 when it is not. Streamlit used to bring it;
    # named so the server keeps the parser it has run on.
    "httptools>=0.8",
    # Named although something else brings each: the session cookie is signed
    # with itsdangerous and the OIDC client talks over httpx, so neither may
    # hang on whichever package happens to pull it in today.
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "lxml>=6.1.1",
    "mcp>=2.3,<2.4",
    "model2vec>=0.9.0",
    "openai>=1.60",
    "openpyxl>=3.1",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    # pandas 3 stores the default `str` dtype in Arrow when pyarrow is there and
    # falls back to Python objects when it is not — slower, and a different
    # dtype under the same name. Streamlit used to bring it; nothing else does.
    "pyarrow>=24.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sqlite-vec>=0.1.9",
    # The server (stocks.web.server) is a Starlette app; FastAPI brings it, but
    # the server imports it directly, so it is named.
    "starlette>=1.6",
    "tiktoken>=0.14.0",
    "trafilatura>=2.2.0",
    # Serves stocks.web.server (`stocks dashboard`, the container entrypoint).
    "uvicorn>=0.53",
    "yfinance>=1.5.2",
]

[project.optional-dependencies]
# Unofficial TradingView TA consensus (stocks.data.tradingview). Opt-in: scrapes
# an undocumented endpoint, may break without notice, personal use only.
tv = ["tradingview-ta>=3.3.0"]

[project.scripts]
stocks = "stocks.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The browser tests (tests/e2e) need Chromium, which `uv sync` does not
# install; they run on request: `uv run pytest -m e2e`. A later `-m` wins.
# Spread over every core (pytest-xdist); `-n0` runs in one process, for a
# debugger or `-x` on a single test. A later `-n` wins too. Work stealing
# rather than fixed chunks: a few API files carry most of the wall time, and
# an idle worker taking from a busy one saved ~3 s of 18 on 2026-10-04.
addopts = ["-m", "not e2e", "-n", "auto", "--dist", "worksteal"]
markers = ["e2e: drives the built app in a real browser (tests/e2e)"]

# Type checking. The whole of src/stocks is checked and CI keeps it that way,
# so a new package is covered the day it lands — there is no include list left
# to forget to extend. Where pandas attaches a method dynamically and no
# checker can see it (DatetimeIndex's date accessors, mainly), the suppression
# sits on a one-line wrapper with a comment naming why, not on the call site.
# Tests are out: their fakes are deliberately partial stand-ins for library
# objects, and typing those adds ceremony without catching a shipped bug.
[tool.ty.src]
include = ["src/stocks"]
# Generated by baml-cli from baml_src/ — CI checks it is fresh instead.
exclude = ["src/stocks/baml_client"]

[tool.ruff]
line-length = 90
target-version = "py312"
extend-exclude = ["src/stocks/baml_client"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.0",
    "ty>=0.0.1a21",
]
