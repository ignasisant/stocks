# Price warm-up — refreshes the books read lately before anyone opens them.
# Manual fallback only.
#
# One POST to the app's own /api/v1/warm (api/warm.py): the app refreshes, on
# the request's thread, the memos a page reads for every account seen in the
# last days, most recent first, within a 240 s budget.
#
# The scheduled ticks live on Google Cloud: a Cloud Scheduler job
# (infra/cron.tf) makes this same call at 00:35, 09:35, 12:35 and 16:35 New
# York time on weekdays — before the European open (the tick that pays the
# day's chart rebase, with Yahoo quiet), after the US open, after the
# European close, after the US close. They left GitHub because a `schedule:`
# here runs when a runner is free, two to five hours late most days. This
# workflow stays for a warm by hand: run it from the Actions tab.
#
# Why not the app itself: Cloud Run throttles CPU between requests and scales
# to zero, so the app cannot schedule its own work. Nothing is checked out —
# the step is one curl.
name: warm

on:
  workflow_dispatch:

concurrency:
  group: warm
  cancel-in-progress: false

permissions: {}

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
    steps:
      - name: Warm the books read lately
        run: |
          if [ -z "$APP_PUBLIC_URL" ] || [ -z "$API_TOKEN" ]; then
            echo "APP_PUBLIC_URL or API_TOKEN secret missing; nothing to warm."
            exit 0
          fi
          curl --fail-with-body -sS -m 290 -X POST \
            -H "Authorization: Bearer $API_TOKEN" \
            "${APP_PUBLIC_URL%/}/api/v1/warm"
