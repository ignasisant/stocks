# Push notifications — price alerts and the reminder.
#
# The day's numbers and the weekly review are scheduled runs now, each at the
# account's own time and filed in its chat: the app runs them itself on a
# Cloud Scheduler tick (notify/schedule.py, infra/cron.tf), because they write
# chat.json, which the live instance owns.
#
# Every job is a headless fan-out over the accounts that turned notifications
# on from a device (Profile → Notifications): user data is enumerated and
# restored from the R2 bucket (STOCKS_STORAGE_*), computed with the pure
# analytics, and pushed to each subscribed device with the app's VAPID key
# (WEBPUSH_PRIVATE_KEY). See src/stocks/notify/.
#
# Timing notes:
# - GitHub cron regularly fires 3-15 min late; nothing here is latency-critical.
# - Cron is UTC. The alerts window 07-20 UTC covers the EU open through
#   most/all of the US session year-round.
name: notifications

on:
  schedule:
    - cron: "7 7-20 * * 1-5" # alerts — hourly, off the top-of-hour rush
    - cron: "0 10 * * 1-5" # nudge — late morning, for accounts quiet a week
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run (alerts | nudge | test)"
        required: true
        default: "alerts"
        type: choice
        options: [alerts, nudge, test]
      user:
        description: "test only: one account label ('owner' or a slug); blank = all"
        required: false
        default: ""
        type: string
      dry_run:
        description: "test only: list recipients, send nothing"
        required: false
        default: false
        type: boolean

concurrency:
  group: notify-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

env:
  STOCKS_STORAGE_ENDPOINT_URL: ${{ secrets.STOCKS_STORAGE_ENDPOINT_URL }}
  STOCKS_STORAGE_BUCKET: ${{ secrets.STOCKS_STORAGE_BUCKET }}
  STOCKS_STORAGE_ACCESS_KEY_ID: ${{ secrets.STOCKS_STORAGE_ACCESS_KEY_ID }}
  STOCKS_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STOCKS_STORAGE_SECRET_ACCESS_KEY }}
  # The app's own VAPID key — the very one the devices subscribed with
  # (`[webpush] private_key`). Unset, nothing can be pushed.
  WEBPUSH_PRIVATE_KEY: ${{ secrets.WEBPUSH_PRIVATE_KEY }}

# The token only reads the repo; nothing here pushes, comments or releases.
permissions:
  contents: read

jobs:
  alerts:
    if: github.event.schedule == '7 7-20 * * 1-5' || inputs.job == 'alerts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen --no-dev
      - run: uv run --no-sync stocks alerts --all-users

  # Accounts with notifications on that have not opened the app for a week get
  # one reminder, and one more a week later; then nothing until they come
  # back (notify/nudge.py). Daily, because the week runs out on any day.
  nudge:
    if: github.event.schedule == '0 10 * * 1-5' || inputs.job == 'nudge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen --no-dev
      - run: uv run --no-sync stocks nudge

  # Manual only: proves the secrets, the bucket roster and the push key are
  # wired, without waiting for a cron or computing anything. Sends one short
  # push to every device of each account (or just `user`), cheap to re-run.
  test:
    if: inputs.job == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen --no-dev
      # Inputs reach the shell as environment variables, never as template
      # expansions inside the script: an expansion is spliced into the command
      # text before bash sees it, so a crafted value would run as code.
      - run: >
          uv run --no-sync stocks notify-test --all-users
          ${NOTIFY_USER:+--user "$NOTIFY_USER"}
          ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NOTIFY_USER: ${{ inputs.user }}
