# Morning market read for the Today page — the part every account shares.
# Manual fallback only.
#
# The scheduled run lives on Google Cloud: Cloud Scheduler starts the
# `topstocks-cron` Cloud Run job (infra/cron.tf) at 06:30 UTC Tuesday to
# Saturday, so each run reads the session that closed the evening before
# (Saturday's reads Friday's). It left GitHub because a `schedule:` here runs
# when a runner is free, which was two to five hours late every day — the page
# had no shared layer all morning. This workflow stays for the day the job is
# down or a read has to be rewritten by hand: run it from the Actions tab.
#
# One file (data/today_market.json in the R2 bucket): the risk-appetite
# regime, trend breadth, sector rotation against the S&P 500, US rates and
# spreads, the Fed's and the ECB's rate and next decision, US and euro-area
# inflation and crypto Fear & Greed, plus a headline and a few lines per
# language written by the keyless free chain and audited against those
# figures (computed lines when no model answers). No user data.
name: today

on:
  workflow_dispatch:

concurrency:
  group: today-market
  cancel-in-progress: false

# The token only reads the repo; nothing here pushes, comments or releases.
permissions:
  contents: read

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STOCKS_STORAGE_ENDPOINT_URL: ${{ secrets.STOCKS_STORAGE_ENDPOINT_URL }}
      STOCKS_STORAGE_BUCKET: ${{ secrets.STOCKS_STORAGE_BUCKET }}
      STOCKS_STORAGE_ACCESS_KEY_ID: ${{ secrets.STOCKS_STORAGE_ACCESS_KEY_ID }}
      STOCKS_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STOCKS_STORAGE_SECRET_ACCESS_KEY }}
      FREE_LLM_GROQ: ${{ secrets.FREE_LLM_GROQ }}
      FREE_LLM_CEREBRAS: ${{ secrets.FREE_LLM_CEREBRAS }}
      FREE_LLM_OPENROUTER: ${{ secrets.FREE_LLM_OPENROUTER }}
      FREE_LLM_DAILY_CAP: ${{ vars.FREE_LLM_DAILY_CAP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen --no-dev
      - name: Write the market read
        run: uv run stocks today-market
