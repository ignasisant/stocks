# Public registers — the short-selling card and the 13F holders list.
#
# Two market-wide files every account shares, mirrored to the R2 bucket:
#
# * data/shorts/ — the EU net-short registers (AFM, FCA, BaFin) and FINRA's
#   daily short volume. The app refreshes them itself when a page finds them
#   stale; this run means the first reader of the day does not pay for it.
# * data/thirteenf.sqlite + data/edgar_frames.json — the SEC's quarterly 13F
#   data set, reduced to the top holders of each CUSIP, and the XBRL frames
#   the sector scan fills gaps from. The data set lands four times a year, so
#   a weekly run is a no-op most weeks; the CUSIP -> ticker mapping (OpenFIGI)
#   resumes where the last run stopped.
#
# No user data, so no bot or Fernet key here. EDGAR_USER_AGENT is the contact
# the SEC asks every automated client to send; unset, the SEC refuses the 13F
# download and that step fails while the registers still refresh.
#
# Timing: 04:15 UTC daily, after the sector (03:00) and crypto (03:30) scans;
# FINRA posts the previous session's volume by then. 13F on Sundays.
name: registers

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      holdings:
        description: "Also rebuild the 13F index today"
        required: false
        default: false
        type: boolean

concurrency:
  group: registers
  cancel-in-progress: false

# The token only reads the repo; nothing here pushes, comments or releases.
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STOCKS_STORAGE_ENDPOINT_URL: ${{ secrets.STOCKS_STORAGE_ENDPOINT_URL }}
      STOCKS_STORAGE_BUCKET: ${{ secrets.STOCKS_STORAGE_BUCKET }}
      STOCKS_STORAGE_ACCESS_KEY_ID: ${{ secrets.STOCKS_STORAGE_ACCESS_KEY_ID }}
      STOCKS_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STOCKS_STORAGE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --frozen --no-dev
      - name: Short-selling registers
        run: uv run stocks shorts
      - name: 13F holders and XBRL frames
        if: github.event_name == 'schedule' || inputs.holdings
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" != "7" ]; then
            echo "13F runs on Sundays"; exit 0
          fi
          uv run stocks holdings-13f
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
