# Lint + tests on every push and PR. This is the gate the manual Cloud Run
# deploy (gcloud run deploy --source) relies on: deploy only from a green main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The token only reads the repo; nothing here pushes, comments or releases.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen
      - run: uv run ruff check .
      # The workflows themselves: unpinned actions, inputs spliced into run
      # scripts, credentials left in the checkout. zizmor is a locked dev
      # dependency so dependabot bumps it with the rest.
      - run: uv run zizmor --no-progress .github/workflows
      # The BAML client is generated from baml_src/ and committed (the image
      # never runs the generator), so an edited .baml file pushed without
      # `baml-cli generate` would ship the old prompts and parsers silently.
      - name: the committed BAML client is the one baml_src generates
        run: |
          uv run baml-cli generate
          stale=$(git status --porcelain -- src/stocks/baml_client)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::src/stocks/baml_client is not what baml_src generates."
            echo "run: uv run baml-cli generate && git add src/stocks/baml_client"
            exit 1
          fi

  # Type checking over all of src/stocks (see [tool.ty.src] in pyproject.toml).
  # A red run here means a new annotation slipped.
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen
      - run: uv run ty check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen
      - run: uv run pytest -q

  # The React shell, and the one thing that can go wrong quietly about it: the
  # bundle it serves is committed inside the Python package (frontend/README.md
  # says why), and nothing in the image or the deploy rebuilds it. A TSX change
  # pushed without `npm run build` therefore ships the *previous* bundle and
  # every check here stays green — so this job rebuilds it and fails if what is
  # committed is not what the sources produce. `npm run build` is also what
  # runs prettier, tsc and vitest, so the front end's own gates ride along.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: npm --prefix frontend/app ci
      - run: npm --prefix frontend/app run build
      # Dead exports and unreachable files. The front end has no linter
      # beyond prettier and tsc, and neither of those sees a helper that
      # nothing imports any more.
      - run: npm --prefix frontend/app run knip
      - name: the committed bundle is the one these sources build
        # `git status`, not `git diff`: a rebuild that *adds* a chunk file
        # leaves it untracked, and a diff would call that clean.
        run: |
          stale=$(git status --porcelain -- src/stocks/web/static/app src/stocks/web/static/mcp)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::the committed bundle is not what these sources build."
            echo "run: npm --prefix frontend/app run build && git add src/stocks/web/static/app src/stocks/web/static/mcp"
            exit 1
          fi

  # The built shell in a real browser, against the real ASGI app with Yahoo,
  # the model and the network sealed off (tests/e2e/serve.py). Runs on the
  # committed bundle, which the frontend job proves is the one the sources build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e -q --tracing retain-on-failure --output test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # The Terraform under infra/ (R2 bucket, Actions secrets, branch ruleset)
  # otherwise has no check at all: a typo there surfaces on the next manual
  # `terraform apply`, weeks later. fmt + validate catch syntax, unknown
  # attributes and type errors without any credential; `-backend=false`
  # leaves the state alone, so nothing here can reach a real resource.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Known-vulnerability scan over the locked dependency set. Runs on main and
  # weekly — not on PRs, so an upstream CVE never blocks unrelated work; the
  # red run on main is the signal to bump the pinned dependency.
  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv export --frozen --no-dev --no-emit-project -o requirements.txt
      - run: uvx pip-audit --strict -r requirements.txt
