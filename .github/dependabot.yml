# Weekly dependency bumps: Python (uv.lock), the frontend (frontend/app) and
# the Actions pins. CI (ci.yml) gates every bump.
#
# Minors and patches travel together — one PR, one review, and a red CI names
# the culprit among a handful of harmless bumps. Majors are deliberately left
# OUT of the groups so each one arrives as its own PR: a breaking major inside
# the group PR (anthropic 0.x -> 1.x, plotly 6 -> 7) turns forty trivial bumps
# into a blocked merge.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # The React app shell. Its bundle is committed (see frontend/README.md), so
  # without this the lockfile rots silently — nothing else here would notice.
  - package-ecosystem: "npm"
    directory: "/frontend/app"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
